name: Build WordPress plugin ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: PHP lint
        run: |
          find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Build WordPress ZIP
        run: |
          mkdir -p build/hangar18-madplan dist
          cp hangar18-madplan.php build/hangar18-madplan/
          cp -R includes assets build/hangar18-madplan/
          cd build
          zip -qr ../dist/hangar18-madplan-0.1.0.zip hangar18-madplan
          cd ..
          sha256sum dist/hangar18-madplan-0.1.0.zip > dist/SHA256SUMS
      - name: Publish installable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: hangar18-madplan-0.1.0
          path: dist/
          if-no-files-found: error
